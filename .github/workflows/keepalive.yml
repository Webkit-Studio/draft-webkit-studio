# Denni ping Supabase REST, aby free tier projekt nespal (reset pocitadla
# inaktivity). URL a anon klic se ctou z assets/config.js - oboji je verejne,
# zadne secrets. Workflow selze jen pri sitove chybe / 5xx, aby prisel mail,
# kdyby ping prestal chodit. Druhy krok drzi workflow nazivu (GitHub vypina
# scheduled workflows po 60 dnech bez commitu): 1x za 30 dni prazdny
# keepalive commit do .github/last-ping.
name: supabase keepalive
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase REST
        run: |
          URL=$(grep -o "SUPABASE_URL: *'[^']*'" assets/config.js | sed "s/.*'\(.*\)'/\1/")
          KEY=$(grep -o "SUPABASE_ANON_KEY: *'[^']*'" assets/config.js | sed "s/.*'\(.*\)'/\1/")
          test -n "$URL" && test -n "$KEY"
          code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' --max-time 30 \
            "$URL/rest/v1/projects?select=slug" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"
          head -c 300 /tmp/resp.txt || true; echo
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
            echo "Supabase ping selhal (HTTP $code)"; exit 1
          fi
      - name: Keep workflow alive
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "dni od posledniho commitu: $age_days"
          if [ "$age_days" -ge 30 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +%Y-%m-%dT%H:%M:%SZ > .github/last-ping
            git add .github/last-ping
            git commit -m "keepalive ping"
            git push
          fi
