<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Draft – Webkit.Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141414; --paper:#F7F6F4; --line:rgba(20,20,20,.12); --mut:rgba(20,20,20,.55);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Urbanist',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
  .wrap{width:100%;max-width:720px;margin:0 auto;padding:0 24px}
  header{padding:40px 0 0}
  .mark{display:flex;align-items:center;gap:10px}
  .blocks{display:flex;gap:3px}
  .blocks span{width:8px;height:14px;background:var(--ink);display:block}
  .blocks span:nth-child(2){clip-path:polygon(0 0,100% 35%,100% 100%,0 100%)}
  .blocks span:nth-child(3){clip-path:polygon(0 35%,100% 0,100% 100%,0 100%)}
  .mark b{font-size:13px;font-weight:700;letter-spacing:.14em}
  main{flex:1;display:flex;align-items:center}
  .list{width:100%;padding:64px 0}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);margin-bottom:28px}
  a.project{display:flex;justify-content:space-between;align-items:baseline;gap:16px;text-decoration:none;color:var(--ink);padding:26px 0;border-top:1px solid var(--line);transition:opacity .15s}
  a.project:last-child{border-bottom:1px solid var(--line)}
  a.project:hover{opacity:.55}
  a.project:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
  .project h2{font-size:clamp(26px,5vw,36px);font-weight:600;letter-spacing:-.01em}
  .project small{font-size:13px;color:var(--mut);font-weight:500;white-space:nowrap}
  .search{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 0 12px;font:inherit;font-size:17px;color:var(--ink);margin-bottom:20px}
  .search::placeholder{color:var(--mut)}
  .search:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
  .noresults{padding:26px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:15px;color:var(--mut)}
  .noresults[hidden]{display:none}
  footer{padding:32px 0 40px;font-size:12px;color:var(--mut)}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
  <header class="wrap">
    <div class="mark" aria-label="Webkit.Studio">
      <div class="blocks" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <b>WEBKIT.STUDIO</b>
    </div>
  </header>
  <main class="wrap">
    <div class="list">
      <p class="eyebrow">Pracovní návrhy</p>
      <input class="search" id="search" type="text" placeholder="Hledat klienta…" aria-label="Hledat klienta" autocomplete="off">
      <a class="project" href="/arbosis/">
        <h2>Arbosis</h2>
        <small>jednostránkový web</small>
      </a>
      <p class="noresults" id="noresults" hidden>Nic nenalezeno.</p>
    </div>
  </main>
  <footer class="wrap">Interní prostředí pro sdílení návrhů. Obsah není určený ke zveřejnění.</footer>
  <script>
    (function () {
      var input = document.getElementById('search');
      var items = Array.prototype.slice.call(document.querySelectorAll('a.project'));
      var empty = document.getElementById('noresults');
      function norm(s) {
        return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      }
      input.addEventListener('input', function () {
        var q = norm(input.value.trim());
        var shown = 0;
        items.forEach(function (item) {
          var hit = !q || norm(item.textContent).indexOf(q) > -1;
          item.style.display = hit ? '' : 'none';
          if (hit) shown++;
        });
        empty.hidden = shown > 0;
      });
    })();
  </script>
</body>
</html>
