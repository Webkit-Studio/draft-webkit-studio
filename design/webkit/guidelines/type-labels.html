<!-- @dsCard group="Type" viewport="700x170" name="Kickery & Labely" subtitle="Uppercase 12/600/0.08em + čtvercová tečka" -->
<!DOCTYPE html>
<html lang="cs">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding: 26px 32px; display: flex; flex-direction: column; gap: 18px;">
  <div style="display: flex; align-items: center; gap: 10px;">
    <span style="width: 8px; height: 8px; background: var(--accent);"></span>
    <span style="font-size: var(--label-size); font-weight: var(--label-weight); letter-spacing: var(--tracking-caps); text-transform: uppercase;">Vybraná práce</span>
    <span style="font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-left: 12px;">kicker: čtverec-tečka (8px, accent nebo černá) + uppercase label</span>
  </div>
  <div style="display: flex; align-items: center; gap: 10px;">
    <span style="width: 8px; height: 8px; background: var(--black);"></span>
    <span style="font-size: var(--label-size); font-weight: var(--label-weight); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-primary);">Proces / 02</span>
  </div>
  <div style="display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--border-line); padding-top: 16px;">
    <span style="font-size: var(--text-xs); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-caps); text-transform: uppercase; border: 1px solid var(--border-strong); padding: 4px 10px;">Webflow</span>
    <span style="font-size: var(--text-xs); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-caps); text-transform: uppercase; border: 1px solid var(--border-line); padding: 4px 10px; color: var(--text-muted);">UX/UI</span>
    <span style="font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">tagy: hairline, radius 0, uppercase</span>
  </div>
</body>
</html>
