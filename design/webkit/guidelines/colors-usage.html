<!-- @dsCard group="Colors" viewport="700x200" name="Barvy v akci" subtitle="Inverzní sekce, CTA, selection" -->
<!DOCTYPE html>
<html lang="cs">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding: 24px 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
  <div style="background: var(--surface-inverse); color: var(--text-inverse); padding: 20px; display: flex; flex-direction: column; gap: 10px; justify-content: space-between;">
    <div style="font-size: 22px; font-weight: var(--weight-heavy); letter-spacing: var(--tracking-heading); line-height: 1.1;">Máte projekt?<br>Pojďme na to.</div>
    <div style="display: flex; gap: 8px; align-items: center;">
      <span style="background: var(--accent); color: var(--accent-ink); font-weight: var(--weight-bold); font-size: 13px; padding: 9px 16px;">Napište nám</span>
      <span style="color: var(--text-inverse-muted); font-size: 12px;">inverzní sekce: černá, bílý text, akcentní CTA</span>
    </div>
  </div>
  <div style="border: 1px solid var(--border-line); padding: 20px; display: flex; flex-direction: column; gap: 12px; justify-content: center;">
    <div style="display: flex; gap: 8px;">
      <span style="background: var(--black); color: var(--white); font-weight: var(--weight-bold); font-size: 13px; padding: 9px 16px;">Primární</span>
      <span style="border: 1px solid var(--black); font-weight: var(--weight-bold); font-size: 13px; padding: 8px 15px;">Sekundární</span>
    </div>
    <div style="font-size: 13px;"><span style="background: var(--accent); color: var(--accent-ink);">Označený text má akcentní podklad.</span></div>
    <div style="font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">na bílé: černá tlačítka · akcent šetřit na 1 CTA</div>
  </div>
</body>
</html>
