<!-- @dsCard group="Layout" viewport="700x160" name="Hairlines" subtitle="Hloubka bez stínů — 1px linky a výměna ploch" -->
<!DOCTYPE html>
<html lang="cs">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding: 24px 32px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;">
  <div>
    <div style="height: 64px; border: 1px solid var(--border-line); background: var(--white);"></div>
    <div style="margin-top: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">--border-line 1px #e2e2e2<br>klidové karty, dividery</div>
  </div>
  <div>
    <div style="height: 64px; border: 1px solid var(--border-strong); background: var(--white);"></div>
    <div style="margin-top: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">--border-strong 1px #000<br>hover, důraz, outline tlačítka</div>
  </div>
  <div>
    <div style="height: 64px; background: var(--black); border: 1px solid var(--border-inverse); box-sizing: border-box; display: flex; align-items: center; justify-content: center;"><span style="width: 60%; border-top: 1px solid var(--border-inverse);"></span></div>
    <div style="margin-top: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">--border-inverse rgba(255,255,255,.24)<br>linky na černé · stíny neexistují</div>
  </div>
</body>
</html>
