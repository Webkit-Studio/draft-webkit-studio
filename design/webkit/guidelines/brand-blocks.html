<!-- @dsCard group="Brand" viewport="700x210" name="Bloky v akci" subtitle="Jediná povolená dekorace — vždy z brand tvarů" -->
<!DOCTYPE html>
<html lang="cs">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding: 24px 32px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; align-items: start;">
  <div>
    <div style="position: relative; height: 110px; background: var(--gray-100); overflow: hidden;">
      <div style="position: absolute; right: 0; bottom: 0; width: 55px; height: 55px; background: var(--black); border-bottom-left-radius: 100%;"></div>
      <div style="position: absolute; right: 55px; bottom: 0; width: 55px; height: 55px; background: var(--black);"></div>
      <div style="position: absolute; right: 0; bottom: 55px; width: 55px; height: 55px; background: var(--accent); border-bottom-left-radius: 100%;"></div>
      <div style="position: absolute; left: 16px; bottom: 12px; font-size: 12px; font-weight: var(--weight-semibold); letter-spacing: var(--tracking-caps); text-transform: uppercase;">Placeholder plochy</div>
    </div>
    <div style="margin-top: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">kompozice bloků v rohu plochy · akcent max 1 blok</div>
  </div>
  <div style="font-size: var(--text-sm); line-height: var(--leading-body); border-left: 1px solid var(--border-line); padding-left: 20px;">
    Bloky (čtverec + čtvrtkruh) jsou jediný dekorativní slovník — pro prázdné stavy, covery slidů, patičky dokumentů. Vždy na mřížce, vždy se dotýkají, nikdy nerotovat ani nedeformovat.
  </div>
</body>
</html>
