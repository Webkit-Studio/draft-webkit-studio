<!-- @dsCard group="Layout" viewport="700x210" name="Rohy & čtvrtkruh" subtitle="Radius 0 všude — jediná křivka je brand čtvrtkruh" -->
<!DOCTYPE html>
<html lang="cs">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding: 24px 32px; display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 20px; align-items: start;">
  <div>
    <div style="height: 96px; border: 1px solid var(--border-line); display: flex; align-items: center; justify-content: center;">
      <span style="background: var(--black); color: var(--white); font-weight: var(--weight-bold); font-size: 13px; padding: 9px 16px;">Radius 0</span>
    </div>
    <div style="margin-top: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">tlačítka, karty, inputy, obrázky</div>
  </div>
  <div>
    <div style="height: 96px; background: var(--black); border-bottom-left-radius: 100%;"></div>
    <div style="margin-top: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">--radius-quarter · jeden roh 100%<br>border-bottom-left-radius: 100%</div>
  </div>
  <div style="font-size: var(--text-sm); line-height: var(--leading-body); border-left: 1px solid var(--border-line); padding-left: 20px;">
    Čtvrtkruh je citace symbolu — kanonicky zaoblený levý dolní roh. Používat střídmě: media bloky, feature plochy, max 1× na sekci. Nikdy na tlačítkách ani formulářích.
  </div>
</body>
</html>
