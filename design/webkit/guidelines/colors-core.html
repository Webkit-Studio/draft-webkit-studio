<!-- @dsCard group="Colors" viewport="700x190" name="Monochrom" subtitle="Černá, bílá, tři šedé — nic víc" -->
<!DOCTYPE html>
<html lang="cs">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding: 24px 32px;">
  <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px;">
    <div>
      <div style="height: 84px; background: var(--black);"></div>
      <div style="margin-top: 8px; font-size: 13px; font-weight: var(--weight-semibold);">Černá</div>
      <div style="font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">#000000 · text, inverzní plochy</div>
    </div>
    <div>
      <div style="height: 84px; background: var(--white); border: 1px solid var(--border-line);"></div>
      <div style="margin-top: 8px; font-size: 13px; font-weight: var(--weight-semibold);">Bílá</div>
      <div style="font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">#ffffff · stránka</div>
    </div>
    <div>
      <div style="height: 84px; background: var(--gray-100);"></div>
      <div style="margin-top: 8px; font-size: 13px; font-weight: var(--weight-semibold);">Gray 100</div>
      <div style="font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">#f4f4f4 · panely</div>
    </div>
    <div>
      <div style="height: 84px; background: var(--gray-300);"></div>
      <div style="margin-top: 8px; font-size: 13px; font-weight: var(--weight-semibold);">Gray 300</div>
      <div style="font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">#e2e2e2 · hairlines</div>
    </div>
    <div>
      <div style="height: 84px; background: var(--gray-500);"></div>
      <div style="margin-top: 8px; font-size: 13px; font-weight: var(--weight-semibold);">Gray 500</div>
      <div style="font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">#6f6f6f · muted text</div>
    </div>
  </div>
</body>
</html>
