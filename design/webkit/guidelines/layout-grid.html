<html lang="cs">

<body style="padding: 24px 32px;">

    </div>
  </div>
  <div style="margin-top: 12px; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); display: flex; gap: 24px;">
    <span>container 1200px</span><span>12 sloupců</span><span>gutter 32px</span><span>sekce 128px</span><span>zarovnání doleva</span>
  </div>
</body>
</html>
